name: flutter_catalog_app
description: "Posts and users catalog backed by the JSONPlaceholder API."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.11.0
  flutter_bloc: ^9.1.1
  bloc: ^9.2.1
  bloc_concurrency: ^0.3.0
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  get_it: ^9.2.1
  injectable: ^3.0.0
  # 11.2.0 builds against a Flutter release newer than this SDK constraint.
  auto_route: 11.1.0
  drift: ^2.28.2
  drift_flutter: ^0.2.7
  intl: ^0.20.2
  stream_transform: ^2.1.1
  dartz: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  freezed: ^3.2.5
  json_serializable: ^6.14.1
  injectable_generator: ^3.0.2
  auto_route_generator: ^10.5.0
  drift_dev: ^2.28.2
  mocktail: ^1.0.5
  bloc_test: ^10.0.0

flutter:
  uses-material-design: true
  generate: true
